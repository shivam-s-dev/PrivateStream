name: Frontend CI

on:
  push:
    paths:
      - 'app/**'
      - 'components/**'
      - 'package.json'
      - 'next.config.ts'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'package.json'
      - 'next.config.ts'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
