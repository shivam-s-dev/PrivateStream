name: Smart Contracts CI

on:
  push:
    paths:
      - 'contracts/**'
  pull_request:
    paths:
      - 'contracts/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts/marketplace

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/marketplace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/marketplace/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests (native target)
        run: cargo test

      - name: Add wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Build WASM release artifact
        run: cargo build --target wasm32v1-none --release
